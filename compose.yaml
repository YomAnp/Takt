name: takt
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: takt
      POSTGRES_PASSWORD: takt_local
      POSTGRES_DB: takt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takt -d takt"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
