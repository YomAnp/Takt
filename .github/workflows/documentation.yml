name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: markdown
            name: Markdown lint
          - check: encoding
            name: UTF-8 integrity
          - check: links
            name: Internal links
          - check: translations
            name: RU / EN consistency
    defaults:
      run:
        working-directory: .github/checks
    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.13.0
      - name: Install check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test documentation checker
        if: matrix.check == 'translations'
        run: npm test
      - name: Run check
        run: npm run check:${{ matrix.check }}
