name: Application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Mobile interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.13.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.12.12
      - name: Install locked dependencies
        run: |
          npm --prefix apps/frontend ci --ignore-scripts --no-audit --no-fund
          python -m pip install uv==0.10.2
          uv sync --project apps/backend --frozen --link-mode copy
      - name: Verify generated API types
        run: |
          uv run --project apps/backend python scripts/export_api.py
          npm --prefix apps/frontend run generate:api
          git diff --exit-code -- apps/frontend/src/shared/api/generated
      - name: Check and build interface
        run: |
          npm --prefix apps/frontend run check:format
          npm --prefix apps/frontend run build
          npm --prefix apps/frontend test
          npm --prefix apps/frontend audit --audit-level=moderate
      - name: Test phone workflows in preinstalled Chrome
        run: npm --prefix apps/frontend run test:browser

  containers:
    name: Docker installation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Check out the installed version
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .previous
          persist-credentials: false
      - name: Install the previous version
        run: python3 .previous/scripts/host.py setup --local --config "$RUNNER_TEMP/takt.env" --project takt-ci --port 8080
      - name: Seed existing user data
        run: |
          docker compose --project-name takt-ci --env-file "$RUNNER_TEMP/takt.env" -f compose.host.yaml exec -T db psql -v ON_ERROR_STOP=1 -U takt -d takt <<'SQL'
          INSERT INTO users (id, telegram_id, display_name, telegram_username, role, onboarded_at)
          VALUES ('11111111-1111-4111-8111-111111111111', 991001, 'Persistent account', 'existing_owner', 'superadmin', now());
          INSERT INTO owner_binding (id, user_id) VALUES (1, '11111111-1111-4111-8111-111111111111');
          INSERT INTO work_schedules (id, user_id, effective_from, end_time)
          VALUES ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', CURRENT_DATE - 1, '18:00');
          INSERT INTO attendance (id, user_id, started_at, ended_at)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111',
            date_trunc('day', now()) - interval '1 day' + interval '9 hours',
            date_trunc('day', now()) - interval '1 day' + interval '18 hours');
          INSERT INTO breaks (id, attendance_id, started_at, ended_at)
          VALUES ('44444444-4444-4444-8444-444444444444', '22222222-2222-4222-8222-222222222222',
            date_trunc('day', now()) - interval '1 day' + interval '12 hours',
            date_trunc('day', now()) - interval '1 day' + interval '12 hours 30 minutes');
          INSERT INTO auth_sessions (token_hash, user_id, expires_at)
          VALUES (repeat('a', 64), '11111111-1111-4111-8111-111111111111', now() + interval '12 hours');
          INSERT INTO audit_log (id, actor_id, action, details)
          VALUES ('55555555-5555-4555-8555-555555555555', '11111111-1111-4111-8111-111111111111', 'installed_before_update', '{}');
          SQL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "takt.env"
          values = dict(line.split("=", 1) for line in source.read_text().splitlines() if "=" in line)
          target = source.with_suffix(".saved.json")
          target.write_text(json.dumps(values))
          target.chmod(0o600)
          PY
      - name: Upgrade the existing installation
        run: |
          python3 scripts/host.py up --config "$RUNNER_TEMP/takt.env" --project takt-ci
          curl --fail http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/ | grep 'Такт'
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "takt.env"
          before = json.loads(source.with_suffix(".saved.json").read_text())
          after = dict(line.split("=", 1) for line in source.read_text().splitlines() if "=" in line)
          assert all(after.get(key) == value for key, value in before.items()), "Installation settings changed"
          assert after["TAKT_PROJECT_NAME"] == "takt-ci"
          base = ["docker", "compose", "--project-name", "takt-ci", "--env-file", str(source), "-f", "compose.host.yaml", "exec", "-T", "db"]
          query = """SELECT
            (SELECT count(*) FROM users WHERE id='11111111-1111-4111-8111-111111111111' AND display_name='Persistent account' AND role='superadmin' AND is_active AND telegram_id=991001)=1
            AND (SELECT count(*) FROM owner_binding WHERE user_id='11111111-1111-4111-8111-111111111111')=1
            AND (SELECT count(*) FROM work_schedules WHERE user_id='11111111-1111-4111-8111-111111111111' AND end_time='18:00')=1
            AND (SELECT extract(epoch FROM ended_at-started_at) FROM attendance WHERE id='22222222-2222-4222-8222-222222222222')=32400
            AND (SELECT extract(epoch FROM ended_at-started_at) FROM breaks WHERE id='44444444-4444-4444-8444-444444444444')=1800
            AND (SELECT count(*) FROM auth_sessions WHERE user_id='11111111-1111-4111-8111-111111111111')=1
            AND (SELECT count(*) FROM audit_log WHERE action='installed_before_update')=1"""
          assert subprocess.check_output(base + ["psql", "-U", "takt", "-d", "takt", "-tAc", query], text=True).strip()=="t"
          backup = next(Path("backups").glob("takt-ci-*.dump"))
          subprocess.run(base + ["createdb", "-U", "takt", "takt_backup_test"], check=True)
          with backup.open("rb") as stream:
              subprocess.run(base + ["pg_restore", "--exit-on-error", "-U", "takt", "-d", "takt_backup_test"], stdin=stream, check=True)
          assert subprocess.check_output(base + ["psql", "-U", "takt", "-d", "takt_backup_test", "-tAc", query], text=True).strip()=="t"
          PY
      - name: Reuse the saved Docker project name
        run: python3 scripts/host.py up --config "$RUNNER_TEMP/takt.env"
      - name: Container logs
        if: failure()
        run: python3 scripts/host.py logs --config "$RUNNER_TEMP/takt.env" --project takt-ci
      - name: Stop test containers
        if: always()
        run: python3 scripts/host.py stop --config "$RUNNER_TEMP/takt.env" --project takt-ci
