name: Application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Mobile interface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.13.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.12.12
      - name: Install locked dependencies
        run: |
          npm --prefix apps/frontend ci --ignore-scripts --no-audit --no-fund
          python -m pip install uv==0.10.2
          uv sync --project apps/backend --frozen --link-mode copy
      - name: Verify generated API types
        run: |
          uv run --project apps/backend python scripts/export_api.py
          npm --prefix apps/frontend run generate:api
          git diff --exit-code -- apps/frontend/src/shared/api/generated
      - name: Check and build interface
        run: |
          npm --prefix apps/frontend run check:format
          npm --prefix apps/frontend run build
          npm --prefix apps/frontend test
          npm --prefix apps/frontend audit --audit-level=moderate
      - name: Test phone workflows in preinstalled Chrome
        run: npm --prefix apps/frontend run test:browser

  containers:
    name: Docker installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install from a clean checkout
        run: python3 scripts/host.py setup --local --config "$RUNNER_TEMP/takt.env" --project takt-ci --port 8080
      - name: Verify API, frontend and persistent updates
        run: |
          curl --fail http://127.0.0.1:8080/health/ready
          curl --fail http://127.0.0.1:8080/ | grep 'Такт'
          docker compose --project-name takt-ci --env-file "$RUNNER_TEMP/takt.env" -f compose.host.yaml exec -T db psql -U takt -d takt -c "INSERT INTO users (id, display_name) VALUES ('11111111-1111-4111-8111-111111111111', 'Persistent account')"
          python3 scripts/host.py up --config "$RUNNER_TEMP/takt.env" --project takt-ci
          test "$(docker compose --project-name takt-ci --env-file "$RUNNER_TEMP/takt.env" -f compose.host.yaml exec -T db psql -U takt -d takt -tAc "SELECT count(*) FROM users WHERE id = '11111111-1111-4111-8111-111111111111'")" = "1"
      - name: Container logs
        if: failure()
        run: python3 scripts/host.py logs --config "$RUNNER_TEMP/takt.env" --project takt-ci
      - name: Stop test containers
        if: always()
        run: python3 scripts/host.py stop --config "$RUNNER_TEMP/takt.env" --project takt-ci
